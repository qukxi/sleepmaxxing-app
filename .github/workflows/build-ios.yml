name: Build iOS Device IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-ios:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Expo Prebuild
        run: npx expo prebuild --platform ios --clean

      - name: Install Pods
        run: cd ios && pod install && cd ..

      - name: Build Device Binary with Xcode
        run: |
          xcodebuild -workspace ios/sleepmaxxingapp.xcworkspace \
            -scheme sleepmaxxingapp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive -archivePath build/sleepmaxxingapp.xcarchive

      - name: Create IPA Package
        run: |
          mkdir -p Payload
          cp -r build/sleepmaxxingapp.xcarchive/Products/Applications/sleepmaxxingapp.app Payload/
          zip -r sleepmaxxing.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sleepmaxxing-device-ipa
          path: sleepmaxxing.ipa
