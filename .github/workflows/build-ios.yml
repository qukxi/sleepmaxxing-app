name: Build iOS Device IPA

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-ios:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Latest Stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Verify Xcode and Swift Version
        run: |
          xcodebuild -version
          swift --version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Patch Expo Modules JSI RuntimeScheduler Header
        run: |
          perl -pi -e 's/SWIFT_RETURNS_RETAINED RuntimeScheduler/RuntimeScheduler/g' node_modules/expo-modules-jsi/apple/Sources/ExpoModulesJSI-Cxx/include/RuntimeScheduler.h
          perl -pi -e 's/CLANG_COVERAGE_MAPPING=NO \\/CLANG_COVERAGE_MAPPING=NO \\\n    SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \\/g' node_modules/expo-modules-jsi/apple/scripts/build-xcframework.sh || true

      - name: Expo Prebuild
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        run: cd ios && pod install && cd ..

      - name: Build Device Binary with Xcode
        run: |
          xcodebuild -workspace ios/sleepmaxxingapp.xcworkspace \
            -scheme sleepmaxxingapp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            archive -archivePath build/sleepmaxxingapp.xcarchive

      - name: Create IPA Package
        run: |
          mkdir -p Payload
          cp -r build/sleepmaxxingapp.xcarchive/Products/Applications/*.app Payload/
          zip -r sleepmaxxing.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sleepmaxxing-device-ipa
          path: sleepmaxxing.ipa
